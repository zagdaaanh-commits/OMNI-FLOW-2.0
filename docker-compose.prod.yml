# OmniFlow production stack (Hong Kong cloud, direct outbound network).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required in .env: DOMAIN, LETSENCRYPT_EMAIL, APP_SECRET_KEY, REDIS_PASSWORD, DATABASE_URL, plus LLM/Meta keys.
# Only nginx publishes ports. `app` has no container_name so it can be scaled for zero-downtime restarts.

name: omniflow

x-app-env: &app-env
  APP_ENV: production
  SCHEDULER_MODE: worker
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
  OMNIFLOW_DISABLE_DOTENV: "1"   # configuration comes from env_file/environment only

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: omniflow:latest
    env_file: .env
    environment: *app-env
    expose:
      - "8000"
    volumes:
      - app-data:/app/data
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  worker:
    image: omniflow:latest
    command: ["python", "-m", "app.worker"]
    env_file: .env
    healthcheck:
      disable: true   # the worker serves no HTTP; the image-level /health check would mark it unhealthy
    environment: *app-env
    volumes:
      - app-data:/app/data
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    # noeviction: a full queue must reject writes, never silently drop scheduled work.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    # Pick up renewed certificates without a manual restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    logging: *default-logging
    networks: [internal, public]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    logging: *default-logging
    networks: [public]

networks:
  internal:
  public:

volumes:
  app-data:
  redis-data:
  letsencrypt:
  certbot-webroot:
