# OmniFlow reverse proxy: TLS termination, gzip, static caching, rate limiting, WebSocket pass-through.
#
# Domain-agnostic on purpose: `server_name _` is a catch-all and the certificate lives under the fixed
# lineage name "omniflow" (deploy_hk.sh runs `certbot certonly --cert-name omniflow -d $DOMAIN`),
# so this file needs no rendering step.

# ------------------------------------------------------------------ zones ---
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# Known abusive crawlers/scanners -> connection dropped without a response.
map $http_user_agent $blocked_agent {
    default                 0;
    ""                      0;   # empty UAs are handled separately for API routes below
    ~*(sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|dirbuster|gobuster|wpscan|semrush|ahrefs|mj12bot|dotbot|petalbot|bytespider) 1;
}
map $http_user_agent $empty_agent {
    default 0;
    ""      1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ------------------------------------------------------------------- http ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ https ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/omniflow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omniflow/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=5s ipv6=off;   # Docker DNS: re-resolves `app` so new replicas are picked up

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Base64 image uploads.
    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    if ($blocked_agent) {
        return 444;
    }

    limit_conn conn_per_ip 30;

    # proxy_pass through a variable: nginx re-resolves `app` per request via the resolver above, so
    # rolling deploys and scaling never leave it on retired container IPs (a literal host resolves once).
    set $upstream_app http://app:8000;

    # Static assets: long-lived caching (filenames are stable, so keep it to 7 days).
    location /static/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass $upstream_app;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
    }

    # Credentials endpoints: strict brute-force protection.
    location /auth/ {
        if ($empty_agent) { return 403; }
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass $upstream_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Everything else (API + dashboard + WebSocket upgrade).
    location / {
        if ($empty_agent) { return 403; }
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass $upstream_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
