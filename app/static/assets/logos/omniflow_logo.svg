<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121420"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Core Ambient Glow -->
  <circle cx="60" cy="60" r="42" fill="url(#coreGlow)"/>
  
  <!-- Outer Interlocking Gyroscope Ring 1 -->
  <ellipse cx="60" cy="60" rx="38" ry="19" fill="none" stroke="url(#ringGrad1)" stroke-width="3.5" transform="rotate(-30 60 60)" filter="url(#glow)"/>
  
  <!-- Inner Interlocking Gyroscope Ring 2 -->
  <ellipse cx="60" cy="60" rx="38" ry="19" fill="none" stroke="url(#ringGrad2)" stroke-width="3.5" transform="rotate(45 60 60)" filter="url(#glow)"/>

  <!-- Center Neural Core Spark -->
  <circle cx="60" cy="60" r="9" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="5.5" fill="#6366F1"/>
  
  <!-- Orbiting Quantum Nodes -->
  <circle cx="30" cy="42" r="3.5" fill="#10B981" filter="url(#glow)"/>
  <circle cx="90" cy="78" r="3.5" fill="#6366F1" filter="url(#glow)"/>
  <circle cx="80" cy="36" r="3" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="40" cy="82" r="2.5" fill="#F43F5E" filter="url(#glow)"/>
</svg>