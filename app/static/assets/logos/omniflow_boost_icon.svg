<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="boostBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A28"/>
      <stop offset="100%" stop-color="#080A12"/>
    </linearGradient>
    <linearGradient id="boostRing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="boostRing2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="boostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="boostBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="156" height="156" rx="38" fill="url(#boostBg)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2"/>
  <circle cx="80" cy="80" r="54" fill="url(#boostGlow)"/>

  <!-- Gyroscope Rings -->
  <ellipse cx="80" cy="80" rx="52" ry="24" fill="none" stroke="url(#boostRing1)" stroke-width="4.5" transform="rotate(-30 80 80)" filter="url(#boostBloom)"/>
  <ellipse cx="80" cy="80" rx="52" ry="24" fill="none" stroke="url(#boostRing2)" stroke-width="4.5" transform="rotate(45 80 80)" filter="url(#boostBloom)"/>

  <!-- Center Core -->
  <circle cx="80" cy="80" r="18" fill="#0A0B10" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Lightning Bolt -->
  <path d="M84 56 L68 84 H82 L76 106 L94 76 H80 Z" fill="url(#boltGrad)" filter="url(#boostBloom)"/>

  <!-- Orbiting Sparks -->
  <circle cx="44" cy="56" r="3.5" fill="#F59E0B" filter="url(#boostBloom)"/>
  <circle cx="116" cy="104" r="3.5" fill="#10B981" filter="url(#boostBloom)"/>
  <circle cx="106" cy="50" r="3" fill="#06B6D4" filter="url(#boostBloom)"/>
</svg>